# Canonical plant data — Commerce City, CO landscape
# Last updated: 2026-02-24
#
# This is the DATA layer. It records facts about each plant and the irrigation
# system, separate from the document (presentation) and notes/ (reasoning).
#
# Fields:
#   group         — trees | evergreens | shrubs | lawn | perennials | grasses | potted
#   irrigation    — drip | sprinkler | manual
#   emitter_gph   — drip emitter output rate (drip plants only)
#   drip_stop     — when to end drip support for this plant:
#                   "october"   = runs with normal system fall taper (off in November)
#                   "september" = cap emitter in September; dry fall critical
#   established   — year planted / establishment year
#   sun           — sun exposure location
#   ph_preferred  — preferred pH range, only listed when significantly below our 7.27
#   annual        — true for annuals (no overwintering expected)
#   notes         — brief operational flags; full reasoning is in notes/


